services:
  # La Base de Datos
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: vulnshield_db
      POSTGRES_USER: jade
      POSTGRES_PASSWORD: "123456"
    ports:
      - "5433:5432" # 5433 es para tu laptop, 5432 es el que Postgres necesita adentro

  # Redis para rate limiting distribuido
  redis:
    image: redis:7-alpine
    restart: always

  # Tu Escáner (Web)
  web:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - .:/app 
    environment:
      - DB_HOST=db
      - DB_NAME=vulnshield_db
      - DB_USER=jade
      - DB_PASSWORD=123456
      - DB_PORT=5432 # El puerto interno siempre debe ser 5432
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY}
      - RATE_LIMIT_STORAGE_URI=redis://redis:6379/0
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
    depends_on:
      - db
      - redis