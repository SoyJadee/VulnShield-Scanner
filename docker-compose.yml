services:
  # La Base de Datos
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: vulnshield_db
      POSTGRES_USER: jade
      POSTGRES_PASSWORD: "123456"
    ports:
      - "5433:5432" # 5433 es para tu laptop, 5432 es el que Postgres necesita adentro

  # Tu Escáner (Web)
  web:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - .:/app 
    environment:
      - DB_HOST=db
      - DB_NAME=vulnshield_db
      - DB_USER=jade
      - DB_PASSWORD=123456
      - DB_PORT=5432 # El puerto interno siempre debe ser 5432
    depends_on:
      - db