<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>VulnShield Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-8">
    <div class="max-w-4xl mx-auto bg-gray-800 p-8 rounded shadow-xl">
        <h1 class="text-3xl font-bold text-blue-500 mb-6">🛡️ VulnShield Scanner</h1>
        
        <form method="POST" class="flex gap-4 mb-8">
            <input type="url" name="url" placeholder="https://testphp.vulnweb.com/listproducts.php?cat=" required 
                   class="flex-1 p-3 rounded bg-gray-700 focus:outline-none focus:border-blue-500 border border-gray-600">
            <button type="submit" class="bg-blue-600 hover:bg-blue-500 px-6 py-3 rounded font-bold">ESCANEAR</button>
        </form>

        {% if resultados %}
        <table class="w-full text-left bg-gray-700 rounded">
            <thead class="bg-gray-600">
                <tr><th class="p-3">Vulnerabilidad</th><th class="p-3">Severidad</th></tr>
            </thead>
            <tbody>
                {% for res in resultados %}
                <tr class="border-b border-gray-600">
                    <td class="p-3">{{ res.tipo }}</td>
                    <td class="p-3">{{ res.severidad }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        {% endif %}
    </div>
</body>
</html>
